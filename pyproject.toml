[project]
name = "gost-research-telegram-agent"
version = "1.0.0"
description = "DeepSeek research agent with Telegram discovery and GOST document validation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "python-telegram-bot>=22,<23", "python-dotenv>=1,<2", "httpx>=0.28,<1",
  "langchain-openai>=1,<2", "langchain-core>=1,<2", "langchain-community>=0.4,<0.5",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "faiss-cpu>=1.10,<2", "fastembed>=0.7,<1", "pydantic>=2.10,<3",
  "python-docx>=1.2,<2", "reportlab>=4,<5", "pypdf>=6,<7",
  "matplotlib>=3.10,<4", "defusedxml>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
research-bot = "research_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

